; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Two programs share this project:
;   remote  - the remote itself (everything in src/ except src/capture/)
;   capture - prints IR codes from the original remotes (only src/capture/)

[platformio]
default_envs = remote

; Settings shared by both environments
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; Serial goes out through the UART USB-C port, not the native USB port
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:remote]
build_src_filter = +<*> -<capture/>
lib_deps =
    z3t0/IRremote@^4.4.1
    olikraus/U8g2@^2.35.30

[env:capture]
build_src_filter = -<*> +<capture/>
lib_deps =
    z3t0/IRremote@^4.4.1
